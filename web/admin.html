<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>অ্যাডমিন প্যানেল</h1><p>Admin token দিন।</p><input id="token" type="password" placeholder="Admin token"><button id="load">রিকোয়েস্ট দেখুন</button><p id="msg"></p><div id="list"></div></main><script>
const token=()=>document.getElementById('token').value, msg=document.getElementById('msg'), list=document.getElementById('list');
async function load(){try{let r=await fetch('/api/admin/requests',{headers:{'X-Admin-Token':token()}}),data=await r.json();if(!r.ok)throw Error(data.detail);list.innerHTML='';data.forEach(j=>{let d=document.createElement('section');d.className='job';let h=document.createElement('h3');h.textContent=`#${j.id} ${j.original_name} — ${j.status}`;d.append(h);let p=document.createElement('p');p.textContent=`Pages/sheet ${j.pages}; ${j.orientation}; duplex ${!!j.duplex}; copies ${j.copies}`;d.append(p);if(j.status==='pending'){let a=document.createElement('button');a.textContent='Approve';a.onclick=()=>action(j.id,'approve');let b=document.createElement('button');b.textContent='Reject';b.onclick=()=>action(j.id,'reject');d.append(a,b)}list.append(d)});msg.textContent=`${data.length}টি রিকোয়েস্ট`;}catch(e){msg.textContent='সমস্যা: '+e.message}}
async function action(id,what){let opts={method:'POST',headers:{'X-Admin-Token':token()}};if(what==='reject'){let f=new FormData();f.set('reason',prompt('কারণ?')||'Rejected');opts.body=f}let r=await fetch(`/api/admin/requests/${id}/${what}`,opts),j=await r.json();if(!r.ok){msg.textContent=j.detail;return}load()}
document.getElementById('load').onclick=load;
</script></body></html>
